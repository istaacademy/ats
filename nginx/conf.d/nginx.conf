upstream web_app {
    server app:8000;
}

upstream minio_console {
    server minio:9001;
}

server {
    listen 443 ssl;
    server_name www.istaacademy.com;

    ssl_certificate /etc/letsencrypt/live/www.istaacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.istaacademy.com/privkey.pem;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

       # Redirect /haceton to external link
    location /haceton {
        return 301 https://app.landik.ir/preview/19275;
    }
    location /static/ {
        alias /usr/src/app/staticfiles/;
    }
    location /media/{
    	alias /usr/src/app/media/;
    }

    location / {
        root /var/www/dist;
        index index.html; # Add this line
        try_files $uri $uri/ /index.html; # Add this line
    }

    location /api {
        proxy_pass https://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Access-Control-Allow-Origin https://www.istaacademy.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        proxy_redirect off;
    }
    location /ista/ {
        proxy_pass https://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 200M;
    }
    # Minio Console
    location /minio/ {
        proxy_pass http://minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
server {
    listen 80;
    server_name www.istaacademy.com;

    location ~/.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    return 301 https://$host:$request_uri;
}

server {
    server_name minio.istaacademy.com;
    location / {
        proxy_pass http://minio:9000;
    }
}

